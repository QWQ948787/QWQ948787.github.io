<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 爛圖展覽館 | AI Hallucination Museum</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-robot"></i>
            <span>AI 爛圖博物館</span>
        </div>
        <div class="nav-actions">
            <button id="theme-toggle" class="btn-icon" aria-label="切換主題">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>歡迎來到 AI 幻覺與演算災難現場</h1>
            <p>這裡收集了演算法最精緻的崩壞瞬間，包含七隻手指的人手、融化的動物與無法名狀的文字。</p>
        </section>

        <section class="filter-bar">
            <button class="filter-btn active" data-filter="all">全部爛圖</button>
            <button class="filter-btn" data-filter="hands">多餘肢體</button>
            <button class="filter-btn" data-filter="faces">崩壞五官</button>
            <button class="filter-btn" data-filter="surreal">超現實幻覺</button>
        </section>

        <div class="gallery" id="gallery">
            <!-- 展覽卡片由 JS 動態渲染與加載 -->
        </div>
    </main>

    <!-- 圖片大圖檢視 Modal -->
    <div id="image-modal" class="modal">
        <span class="close-modal">&times;</span>
        <div class="modal-content">
            <div id="modal-image-container"></div>
            <div class="modal-info">
                <h3 id="modal-title"></h3>
                <p id="modal-prompt"></p>
                <span id="modal-tag" class="tag"></span>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 AI 爛圖博物館 - 完美是偶然，崩壞才是常態。</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
